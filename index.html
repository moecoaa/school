<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноРулетка | Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div class="container">
        <header class="main-header">
            <div class="top-bar">
                <button class="favorites-btn" onclick="toggleFavoritesView()" id="favToggleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    Мои фильмы
                </button>
            </div>
            <h1>Что посмотреть?</h1>
            <p class="subtitle" id="mainSubtitle">Выбери жанр и доверься рулетке</p>
        </header>

        <!-- ФИЛЬТРЫ (скрываются в Моих фильмах) -->
        <div class="filters-wrapper" id="filtersWrapper">
            <div class="filters" id="filters">
                <button class="filter-btn active" data-genre="all">Все подряд</button>
                <button class="filter-btn" data-genre="28">Боевик</button>
                <button class="filter-btn" data-genre="12">Приключения</button>
                <button class="filter-btn" data-genre="35">Комедия</button>
                <button class="filter-btn" data-genre="80">Криминал</button>
                <button class="filter-btn" data-genre="18">Драма</button>
                <button class="filter-btn" data-genre="14">Фэнтези</button>
                <button class="filter-btn" data-genre="27">Ужасы</button>
                <button class="filter-btn" data-genre="878">Фантастика</button>
                <button class="filter-btn" data-genre="53">Триллер</button>
            </div>
        </div>

        <!-- ЭКРАН ПРИВЕТСТВИЯ -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-content">
                <h2 class="welcome-title" id="welcomeTitle">Нажми на кнопку ниже</h2>
                <p class="welcome-subtitle" id="welcomeSubtitle">И мы подберем для тебя идеальный фильм на вечер</p>
                <div class="arrow-down" id="welcomeArrow">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ec4899" />
                                <stop offset="100%" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                        <path d="M12 5v14M19 12l-7 7-7-7"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- СЕТКА МОИХ ФИЛЬМОВ (Появляется при клике на "Мои фильмы") -->
        <div class="favorites-grid hidden" id="favoritesGrid">
            <!-- Сюда скрипт будет добавлять карточки -->
        </div>

        <!-- ОСНОВНАЯ КАРТОЧКА ФИЛЬМА -->
        <main class="movie-card hidden" id="movieCard">
            <div class="poster-wrapper">
                <div class="poster-bg" id="posterBg"></div>
                <img id="poster" class="poster" src="" alt="Постер">
                <div class="poster-overlay"></div>
                <button class="fav-heart" id="favHeartBtn" onclick="toggleFavorite()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
            </div>
            
            <div class="info">
                <div class="info-top">
                    <span id="genre" class="genre-tag">ФИЛЬМ</span>
                    <div class="meta-info">
                        <span id="genreBadge" class="genre-badge" style="display: none;"></span>
                        <span id="year" class="year">2024</span>
                        <div id="rating" class="rating">0.0</div>
                    </div>
                </div>
                
                <div class="title-row">
                    <h2 id="title" class="movie-title">Название</h2>
                    <span id="adultBadge" class="adult-badge" style="display: none;">18+</span>
                </div>
                
                <p id="description" class="description">Описание</p>
                
                <div class="actions" id="actionsContainer">
                    <button class="btn btn-trailer" onclick="openTrailer()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Смотреть трейлер
                    </button>
                    <button class="btn btn-vk" onclick="searchVK()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                        Смотреть фильм
                    </button>
                </div>
            </div>
        </main>

        <!-- КНОПКА РУЛЕТКИ -->
        <div class="spin-btn-container" id="spinBtnContainer">
            <button class="spin-btn" id="spinBtn" onclick="spinRoulette()">
                КРУТИТЬ РУЛЕТКУ
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
