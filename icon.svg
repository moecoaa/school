<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Коробка попкорна (занимает почти всё место) -->
    <path d="M 15 45 L 25 95 L 75 95 L 85 45 Z" fill="#1a1d2d" stroke="#ec4899" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Полоски на коробке -->
    <line x1="40" y1="45" x2="45" y2="95" stroke="#ec4899" stroke-width="6" opacity="0.6"/>
    <line x1="60" y1="45" x2="55" y2="95" stroke="#ec4899" stroke-width="6" opacity="0.6"/>
    
    <!-- Горка попкорна (крупные шарики) -->
    <circle cx="25" cy="40" r="14" fill="#8b5cf6"/>
    <circle cx="50" cy="30" r="18" fill="#8b5cf6"/>
    <circle cx="75" cy="40" r="14" fill="#8b5cf6"/>
    
    <!-- Верхние шарики для объема -->
    <circle cx="38" cy="45" r="12" fill="#a78bfa"/>
    <circle cx="62" cy="45" r="12" fill="#a78bfa"/>
    <circle cx="50" cy="48" r="10" fill="#c4b5fd"/>
</svg>